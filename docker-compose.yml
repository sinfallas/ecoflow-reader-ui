services:
  ui:
    image: node:22-alpine
    container_name: ecoflow_ui
    hostname: ecoflow_ui
    pull_policy: always
    environment:
      TZ: 'America/Caracas'
    volumes:
      - .:/app
    working_dir: /app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
