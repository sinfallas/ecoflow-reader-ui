services:
  # Entorno de desarrollo interactivo (Vite)
  ui-dev:
    image: node:22-alpine
    container_name: ecoflow_ui_dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # Entorno de producción (Nginx multi-stage)
  ui-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecoflow_ui_prod
    ports:
      - "80:80"
    restart: unless-stopped

  # Entorno para Pruebas E2E (Playwright)
  ui-e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-jammy
    working_dir: /app
    ipc: host
    volumes:
      - .:/app
    profiles:
      - e2e
    extra_hosts:
      - "host.docker.internal:host-gateway"
